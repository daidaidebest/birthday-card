<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="生日童话">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="description" content="师宝宝的生日童话：月光送来的信、会自己翻页的魔法书、两条在深圳相遇的来路、风与星光，和一个只属于你的生日愿望。">
<title>师宝宝的生日童话</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/gift-serif.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/img/moon.webp" as="image">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/scenes.css">
<link rel="stylesheet" href="css/keepsake.css">
</head>
<body>
<main id="film" class="is-loading">
  <div id="stage" aria-live="off"></div>
  <canvas id="pups" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="bars" aria-hidden="true"><i></i><i></i></div>
  <div id="grain" aria-hidden="true"></div>
  <div id="subtitle" aria-live="polite"></div>
  <div id="chapter-card" aria-hidden="true"><small></small><b></b><span></span><em class="cc-candles"><i></i><i></i><i></i><i></i><i></i><i></i></em></div>

  <section id="gate" aria-label="开始">
    <canvas class="gate-sky" aria-hidden="true"></canvas>
    <div class="gate-inner">
      <p class="gate-eyebrow">A BIRTHDAY FAIRY TALE · 11.03</p>
      <h1>师宝宝的<br>生日童话</h1>
      <div class="gate-orrery">
        <i class="gate-halo" aria-hidden="true"></i>
        <svg class="gate-dial" viewBox="-210 -210 420 420" aria-hidden="true"></svg>
        <button id="gate-moon" type="button" aria-label="按住月亮，开始"><canvas></canvas></button>
      </div>
      <p class="gate-hint"><span class="idle">按住月亮，等它慢慢圆满</span><span class="hold">再等一等……</span></p>
      <p class="gate-note">建议戴上耳机 · 打开声音 · 留出十分钟</p>
      <p class="gate-loading" id="gate-loading">月光正在赶来…</p>
    </div>
    <i class="gate-flood" aria-hidden="true"></i>
  </section>

  <nav id="hud" aria-label="控制">
    <button id="btn-sound" type="button" aria-label="静音" aria-pressed="true"><span class="eq"><i></i><i></i><i></i><i></i></span></button>
    <button id="btn-pause" type="button" aria-label="暂停"><span class="ico-pause"></span></button>
    <button id="btn-menu" type="button" aria-label="章节">章节</button>
  </nav>
  <div id="menu" hidden>
    <div class="menu-paper">
      <p class="menu-eyebrow">CONTENTS</p>
      <ol id="menu-list"></ol>
      <button type="button" id="menu-close">合上目录</button>
    </div>
  </div>
  <button id="btn-next" type="button" hidden>继续 <span>→</span></button>
  <div id="progress" aria-hidden="true"><i></i></div>
</main>
<script src="js/content.js"></script>
<script src="js/gift.js"></script>
</body>
</html>
